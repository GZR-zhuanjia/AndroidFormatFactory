name: Android checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential curl xz-utils pkg-config nasm
      - name: Build pinned LGPL audio dependencies
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" ./scripts/build-native.sh --abis arm64-v8a,x86_64 --jobs 2
      - name: Check and compile
        run: ./gradlew --no-daemon :app:checkNativeDependencies :app:compileDebugKotlin :app:externalNativeBuildDebug
